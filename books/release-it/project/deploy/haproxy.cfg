global
    maxconn 20000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    option dontlog-normal
    timeout connect 5s
    timeout client 10s
    timeout server 10s
    timeout http-request 5s

frontend tenants
    bind :8080
    default_backend gateways

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 2s

backend gateways
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # A connection that fails (a gateway just died) is retried once on
    # another gateway; a request a gateway has accepted is never repeated.
    retries 1
    retry-on conn-failure
    option redispatch
    # Each gateway gets at most maxconn requests at once, a little above its
    # own shed limit so the gateway refuses first, in microseconds. When every
    # gateway is full, a request waits here at most 500 ms, then gets 503.
    timeout queue 500ms
    default-server check inter 1s fall 2 rise 2 maxconn 32 resolvers docker init-addr last,libc,none
    server gateway-a gateway-a:8080
    server gateway-b gateway-b:8080
    server gateway-c gateway-c:8080
