global
    maxconn 20000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    option dontlog-normal
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend tenants
    bind :8080
    default_backend gateways

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 2s

backend gateways
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server gateway-a gateway-a:8080
    server gateway-b gateway-b:8080
    server gateway-c gateway-c:8080
